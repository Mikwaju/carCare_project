environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2 # for the authentication work of he app
