name: carcare
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2 # for the authentication work of he app
  cloud_firestore: ^5.6.7
  cupertino_icons: ^1.0.8
  fl_chart: ^0.71.0 # make sure this is the latest version
  google_maps_flutter: ^2.7.0
  firebase_database: ^11.3.6
  connectivity_plus: ^6.1.4
  flutter_local_notifications: ^19.2.1
  intl: ^0.20.2
  pdf: ^3.11.3
  excel: ^3.0.0
  open_file: ^3.3.2
  path_provider: ^2.1.5
  intl_phone_field: ^3.2.0
  email_validator: ^3.0.0
  permission_handler: ^12.0.0+1
  flutter_blue:
    path: ./plugins/flutter_blue
  url_launcher: ^6.3.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true # add this line
  assets:
    - assets/